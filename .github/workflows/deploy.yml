name: Deploy to OCI

# main에 push되면 OCI 서버에 SSH로 붙어 pull → build → 컨테이너 교체까지 수행한다.
# 글(content/*.md)만 고쳐도 같은 경로를 타므로, 블로그 발행 = git push 한 번.
#
# ── 사전 준비 (GitHub 저장소 Settings에서 1회) ────────────────────────────────
# Secrets and variables → Actions → Secrets 탭:
#   SSH_HOST         배포 서버 주소 (예: 1.2.3.4 또는 thmm.kr) — 포트는 넣지 말 것
#   SSH_USER         SSH 계정 (예: ubuntu / opc)
#   SSH_PRIVATE_KEY  개인키 전문 (-----BEGIN ... KEY----- 부터 끝까지)
#   SSH_KNOWN_HOSTS  `ssh-keyscan -H <서버주소>` 출력 그대로.
#                    중간자 공격 방지용이며, 비우면 이 워크플로우는 실패한다.
#                    ※ SSH 포트가 22가 아니면 반드시 -p 를 붙여서 뜬다:
#                        ssh-keyscan -H -p 2222 <서버주소>
#                      known_hosts 항목이 [host]:port 형태로 나와야 매칭된다.
#                      포트 없이 뜬 키를 넣으면 "Host key verification failed" 로 죽는다.
#
# Variables 탭 (비밀 아님, 없으면 아래 기본값 사용):
#   SSH_PORT         SSH 포트                 (기본 22)
#   DEPLOY_PATH      git 저장소 경로           (기본 ~/flash-coupon/portfolio)
#   COMPOSE_DIR      docker-compose.yml 위치   (기본 ~/flash-coupon)
#   COMPOSE_SERVICE  compose 서비스명          (기본 portfolio)
#   CONTAINER_NAME   컨테이너 이름             (기본 portfolio)
#   HOST_PORT        호스트 포트               (기본 3002)
#
# ※ 이 사이트 컨테이너는 compose 프로젝트 flash-coupon 이 소유한다
#   (backend / postgres / redis 등과 같은 스택). 그래서 bare `docker run` 이 아니라
#   `docker compose build && up -d --no-deps <service>` 로만 교체한다.
#   bare run 으로 갈아치우면 compose 상태와 어긋나고, 다음 `compose up` 때 꼬인다.
#
# ── 서버가 느려서 빌드가 버거우면 ──────────────────────────────────────────
# 이미지를 GitHub Actions에서 빌드해 GHCR에 push하고 서버는 pull만 하도록
# 바꿀 수 있다. 그때는 서버에 registry 로그인 설정이 추가로 필요하다.

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 컨테이너 교체가 서로를 밟는다. 뒤에 온 것만 살리고 앞엣것은 취소.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -n "${{ secrets.SSH_HOST }}" ]        || missing="$missing SSH_HOST"
          [ -n "${{ secrets.SSH_USER }}" ]        || missing="$missing SSH_USER"
          [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ] || missing="$missing SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::등록되지 않은 secret:$missing"
            echo "저장소 Settings → Secrets and variables → Actions 에서 등록하세요."
            exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Pull, build, and swap container
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/flash-coupon/portfolio' }}
          COMPOSE_DIR: ${{ vars.COMPOSE_DIR || '~/flash-coupon' }}
          COMPOSE_SERVICE: ${{ vars.COMPOSE_SERVICE || 'portfolio' }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'portfolio' }}
          HOST_PORT: ${{ vars.HOST_PORT || '3002' }}
          GIT_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' COMPOSE_DIR='$COMPOSE_DIR' COMPOSE_SERVICE='$COMPOSE_SERVICE' CONTAINER_NAME='$CONTAINER_NAME' HOST_PORT='$HOST_PORT' GIT_SHA='$GIT_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          REPO_DIR="${DEPLOY_PATH/#\~/$HOME}"
          STACK_DIR="${COMPOSE_DIR/#\~/$HOME}"

          # compose v2(플러그인)와 v1(단독 바이너리) 중 있는 쪽을 쓴다.
          if docker compose version >/dev/null 2>&1; then
            DC="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            DC="docker-compose"
          else
            echo "::error::docker compose 를 찾을 수 없습니다."
            exit 1
          fi

          cd "$REPO_DIR"
          echo "▸ 저장소: $(pwd)"

          # compose가 소스에서 직접 빌드하므로, 롤백 기준은 이미지가 아니라 커밋이다.
          PREV_SHA=$(git rev-parse HEAD)
          echo "▸ 이전 커밋: ${PREV_SHA:0:7}"

          # --ff-only: 서버에 로컬 커밋이 생겨 갈라졌으면 조용히 덮어쓰지 않고 실패시킨다.
          git fetch --prune origin main
          git pull --ff-only origin main
          echo "▸ 체크아웃: $(git rev-parse --short HEAD)"

          # 이 컨테이너는 compose(project=flash-coupon)가 소유한다. bare docker run 으로
          # 갈아치우면 compose 상태와 어긋나므로 반드시 compose를 통해서만 건드린다.
          # --no-deps: 같은 스택의 postgres/redis/backend 를 함께 재생성하지 않는다.
          cd "$STACK_DIR"
          echo "▸ 스택: $(pwd) / 서비스: $COMPOSE_SERVICE"
          $DC build "$COMPOSE_SERVICE"
          $DC up -d --no-deps "$COMPOSE_SERVICE"

          # 기동 확인 — 30초 안에 200이 안 나오면 실패로 처리하고 로그를 남긴다.
          # /blog 까지 확인하는 이유: 이미지에 content/ 가 안 들어가면 앱은 정상 기동하고
          # 블로그만 조용히 빈 목록이 된다. 홈만 찔러보면 그걸 못 잡는다.
          echo "▸ 헬스체크 (localhost:$HOST_PORT)"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://localhost:$HOST_PORT/"; then
              echo "▸ 홈 OK (${i}초)"
              if curl -fsS -o /dev/null "http://localhost:$HOST_PORT/blog"; then
                echo "▸ 블로그 OK"
                docker image prune -f >/dev/null 2>&1 || true
                exit 0
              fi
              echo "::error::홈은 뜨는데 /blog 가 실패 — content/ 복사 누락일 가능성이 큽니다."
              break
            fi
            sleep 1
          done

          echo "::error::헬스체크 실패 — 컨테이너 로그 마지막 50줄:"
          docker logs --tail 50 "$CONTAINER_NAME" || true
          echo "롤백하려면 서버에서:"
          echo "  cd $REPO_DIR && git reset --hard ${PREV_SHA:0:7}"
          echo "  cd $STACK_DIR && $DC build $COMPOSE_SERVICE && $DC up -d --no-deps $COMPOSE_SERVICE"
          exit 1
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
