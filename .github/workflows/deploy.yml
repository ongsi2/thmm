name: Deploy to OCI

# main에 push되면 OCI 서버에 SSH로 붙어 pull → build → 컨테이너 교체까지 수행한다.
# 글(content/*.md)만 고쳐도 같은 경로를 타므로, 블로그 발행 = git push 한 번.
#
# ── 사전 준비 (GitHub 저장소 Settings에서 1회) ────────────────────────────────
# Secrets and variables → Actions → Secrets 탭:
#   SSH_HOST         배포 서버 주소 (예: 1.2.3.4 또는 thmm.kr)
#   SSH_USER         SSH 계정 (예: ubuntu / opc)
#   SSH_PRIVATE_KEY  개인키 전문 (-----BEGIN ... KEY----- 부터 끝까지)
#   SSH_KNOWN_HOSTS  `ssh-keyscan -H <서버주소>` 출력 그대로.
#                    중간자 공격 방지용이며, 비우면 이 워크플로우는 실패한다.
#
# Variables 탭 (비밀 아님, 없으면 아래 기본값 사용):
#   DEPLOY_PATH      서버의 저장소 경로  (기본 ~/thmm)
#   CONTAINER_NAME   컨테이너 이름       (기본 thmm)
#   HOST_PORT        호스트 포트         (기본 3002)
#
# ── 서버가 느려서 빌드가 버거우면 ──────────────────────────────────────────
# 이미지를 GitHub Actions에서 빌드해 GHCR에 push하고 서버는 pull만 하도록
# 바꿀 수 있다. 그때는 서버에 registry 로그인 설정이 추가로 필요하다.

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 컨테이너 교체가 서로를 밟는다. 뒤에 온 것만 살리고 앞엣것은 취소.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -n "${{ secrets.SSH_HOST }}" ]        || missing="$missing SSH_HOST"
          [ -n "${{ secrets.SSH_USER }}" ]        || missing="$missing SSH_USER"
          [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ] || missing="$missing SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::등록되지 않은 secret:$missing"
            echo "저장소 Settings → Secrets and variables → Actions 에서 등록하세요."
            exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Pull, build, and swap container
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/thmm' }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'thmm' }}
          HOST_PORT: ${{ vars.HOST_PORT || '3002' }}
          GIT_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' CONTAINER_NAME='$CONTAINER_NAME' HOST_PORT='$HOST_PORT' GIT_SHA='$GIT_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_PATH/#\~/$HOME}"
          echo "▸ 작업 디렉토리: $(pwd)"

          # --ff-only: 서버에 로컬 커밋이 생겨 갈라졌으면 조용히 덮어쓰지 않고 실패시킨다.
          git fetch --prune origin main
          git pull --ff-only origin main
          echo "▸ 체크아웃: $(git rev-parse --short HEAD)"

          # 새 이미지를 먼저 만든 뒤에 컨테이너를 교체한다 → 다운타임이 빌드 시간이 아니라 초 단위.
          # SHA 태그를 남겨두면 롤백이 `docker run ... thmm:<이전SHA>` 한 줄로 끝난다.
          docker build -t "thmm:$GIT_SHA" -t thmm:latest .

          PREVIOUS=$(docker inspect --format='{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || echo "")
          [ -n "$PREVIOUS" ] && echo "▸ 이전 이미지: $PREVIOUS"

          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm   "$CONTAINER_NAME" 2>/dev/null || true
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$HOST_PORT:3002" \
            thmm:latest

          # 기동 확인 — 30초 안에 200이 안 나오면 실패로 처리하고 로그를 남긴다.
          # /blog 까지 확인하는 이유: 이미지에 content/ 가 안 들어가면 앱은 정상 기동하고
          # 블로그만 조용히 빈 목록이 된다. 홈만 찔러보면 그걸 못 잡는다.
          echo "▸ 헬스체크 (localhost:$HOST_PORT)"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://localhost:$HOST_PORT/"; then
              echo "▸ 홈 OK (${i}초)"
              if curl -fsS -o /dev/null "http://localhost:$HOST_PORT/blog"; then
                echo "▸ 블로그 OK"
                docker image prune -f >/dev/null 2>&1 || true
                exit 0
              fi
              echo "::error::홈은 뜨는데 /blog 가 실패 — content/ 복사 누락일 가능성이 큽니다."
              break
            fi
            sleep 1
          done

          echo "::error::헬스체크 실패 — 컨테이너 로그 마지막 50줄:"
          docker logs --tail 50 "$CONTAINER_NAME" || true
          [ -n "$PREVIOUS" ] && echo "롤백: docker rm -f $CONTAINER_NAME && docker run -d --name $CONTAINER_NAME --restart unless-stopped -p $HOST_PORT:3002 $PREVIOUS"
          exit 1
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
